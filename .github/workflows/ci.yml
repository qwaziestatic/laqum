name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Service containers are reachable on localhost from the job, on their
  # standard ports. These differ from docker-compose.test.yml, which shifts
  # ports to avoid colliding with a developer's running dev stack.
  TEST_DATABASE_URL: postgres://laqum:laqum@localhost:5432/laqum_test
  TEST_REDIS_URL: redis://localhost:6379

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: laqum
          POSTGRES_PASSWORD: laqum
          POSTGRES_DB: laqum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laqum -d laqum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Migrate
        run: pnpm --filter @laqum/db migrate up
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # The generated types are committed. If the schema and the checked-in
      # types disagree, someone changed a migration without regenerating, and
      # every later typecheck would be lying about the database.
      - name: Check generated DB types are up to date
        run: pnpm --filter @laqum/db codegen:verify
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Typecheck
        run: pnpm typecheck

      # Exercises the dist/ resolution path that production uses, which the
      # test aliases deliberately bypass.
      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t laqum-api:ci .

  # A SEPARATE JOB. The e2e suite starts a real API, a real Vite server and a
  # browser; keeping it apart means a unit-test failure is reported in seconds
  # rather than behind a browser download, and the two can run concurrently.
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: laqum
          POSTGRES_PASSWORD: laqum
          POSTGRES_DB: laqum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laqum -d laqum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Chromium only. The dashboard targets an Android tablet, so Firefox and
      # WebKit would be testing browsers this product does not ship on.
      - name: Install Playwright Chromium
        run: pnpm e2e:install --with-deps chromium

      - name: Migrate
        run: pnpm --filter @laqum/db migrate up
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # REQUIRED, and the reason this job once failed before any test ran.
      #
      # The e2e suite runs the COMPILED API (`node dist/server.js`) and the
      # BUILT dashboard (`vite preview`), so that it exercises the same module
      # resolution production uses. On a fresh checkout dist/ does not exist,
      # so it has to be built here. Kept as its own step so a build failure is
      # reported as a build failure rather than as "webServer did not start".
      - name: Build
        run: pnpm build

      # The realtime timing budget is deliberately looser here than locally
      # (5s vs 1s) — a shared runner's scheduler jitter is not a product
      # defect. The measured latency is printed either way, so a creeping
      # regression is visible long before it breaches the budget.
      - name: End-to-end tests
        run: pnpm exec playwright test
        env:
          CI: 'true'
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          TEST_REDIS_URL: ${{ env.TEST_REDIS_URL }}

      # Uploaded whether or not the run passed: the screenshots are review
      # material, not only failure evidence.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: e2e/screenshots/
          if-no-files-found: error

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/.results/
          if-no-files-found: ignore
