services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: laqum
      POSTGRES_PASSWORD: laqum
      POSTGRES_DB: laqum
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -U and -d are required: without them pg_isready probes the `root` role
      # and reports the container healthy only by accident.
      test: ['CMD-SHELL', 'pg_isready -U laqum -d laqum']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: info
      # Inside the compose network the hosts are the service names, not localhost.
      DATABASE_URL: postgres://laqum:laqum@postgres:5432/laqum
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
