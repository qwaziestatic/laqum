# DEVELOPMENT infrastructure only: PostgreSQL and Redis for `pnpm dev`
# (`pnpm infra:up`). The whole stack as it ships, API and Caddy included,
# is docker-compose.prod.yml; `bash deploy/smoke.sh` runs it locally.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: laqum
      POSTGRES_PASSWORD: laqum
      POSTGRES_DB: laqum
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -U and -d are required: without them pg_isready probes the `root` role
      # and reports the container healthy only by accident. -h 127.0.0.1: only
      # the REAL server listens on TCP; the image's init server is socket-only,
      # and a socket probe can pass just before it restarts (CI #25).
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U laqum -d laqum']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
